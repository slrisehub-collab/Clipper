# Self-hosted ClipForge: everything free and open source.
# Easiest: run deploy/install.sh on a fresh Ubuntu/Debian server. Manually:
#   cp .env.example .env   (set SIGNING_SECRET, APP_URL, SITE_ADDRESS)
#   docker compose up -d --build
#   docker compose run --rm web npm run migrate
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
      POSTGRES_DB: clipforge
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "clipforge"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://clipforge:clipforge@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/storage
      WORK_DIR: /data/tmp
    expose: ["3000"]
    volumes: [media:/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://clipforge:clipforge@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/storage
      WORK_DIR: /data/tmp
    volumes: [media:/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    stop_grace_period: 2m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web]

volumes:
  caddydata:
  pgdata:
  redisdata:
  media:
